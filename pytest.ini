[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
pythonpath = .
# 默认过滤掉需要调用真实 LLM 的 RAGAS 评测（要花 token / 需要网络），
# 需要时显式打开：pytest -m ragas
addopts = -ra -m "not ragas"
markers =
    integration: 需要完整服务（MySQL/ES/Redis/Chroma）的集成测试
    ragas: 需要真实 LLM API 的 RAGAS 评估测试（默认跳过，用 -m ragas 开启）
    slow: 耗时较长的测试
